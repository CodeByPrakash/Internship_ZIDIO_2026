version: '3.8'

services:
  server:
    build: ./server
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - MONGO_URI=mongodb://mongo:27017/intellmeet
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET:-intellmeet_jwt_secret_2026}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET:-intellmeet_refresh_secret_2026}
      - CLIENT_URL=http://localhost
    depends_on:
      - mongo
      - redis
    restart: unless-stopped

  client:
    build: ./client
    ports:
      - "80:80"
    depends_on:
      - server
    restart: unless-stopped

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    restart: unless-stopped

volumes:
  mongo_data:
